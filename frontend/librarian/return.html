<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Process Return · Library</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="with-sidebar">
    <div id="shell" data-role="librarian"></div>

    <main>
      <div class="page-head">
        <div>
          <h1>Process Return</h1>
          <p class="muted">Pick the student and the book, record the return date, then confirm.</p>
        </div>
      </div>

      <div id="alert" class="alert hidden"></div>

      <div class="grid-side">
        <form id="form" class="card" novalidate>
          <div class="field">
            <label for="StudentID">Student ID</label>
            <div class="inline">
              <input id="StudentID" placeholder="25A-0058" autocomplete="off">
              <button type="button" class="btn secondary" id="find">Find</button>
            </div>
            <p class="muted" id="student-name" style="margin-top:8px"></p>
          </div>

          <div class="field">
            <label for="BorrowID">Book</label>
            <select id="BorrowID" disabled>
              <option value="">Find a student first</option>
            </select>
          </div>

          <div class="field">
            <label for="ReturnDate">Return date</label>
            <input id="ReturnDate" type="date">
          </div>

          <button class="btn" type="submit" id="confirm" disabled>Confirm return</button>
        </form>

        <aside class="card" aria-live="polite">
          <h2>Summary</h2>
          <div id="summary"><p class="muted">Pick a book to see its due date and any fine.</p></div>
        </aside>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/librarian/return.js"></script>
</body>
</html>
