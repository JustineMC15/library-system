<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Non-Working Days · Library</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="with-sidebar">
    <div id="shell" data-role="librarian"></div>

    <main>
      <div class="page-head">
        <div>
          <h1>Non-Working Days</h1>
          <p class="muted">Marked days don't count toward due dates or fines. Sundays are skipped automatically.</p>
        </div>
      </div>

      <div id="alert" class="alert hidden"></div>

      <div class="grid-side">
        <section class="card" aria-labelledby="month">
          <div class="cal-head">
            <button type="button" class="btn secondary" id="prev" aria-label="Previous month">Previous</button>
            <h2 id="month" style="margin:0" aria-live="polite"></h2>
            <button type="button" class="btn secondary" id="next" aria-label="Next month">Next</button>
          </div>
          <div class="cal" id="cal"></div>
        </section>

        <aside class="card" aria-labelledby="list-title">
          <h2 id="list-title">Marked dates</h2>
          <ul class="side-list" id="list"><li class="muted">Loading…</li></ul>
        </aside>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/librarian/nonworking.js"></script>
</body>
</html>
