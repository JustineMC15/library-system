<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · OLOPS College Library</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="with-sidebar">
    <div id="shell" data-role="librarian"></div>

    <main>
      <div class="page-head">
        <div>
          <h1>Dashboard</h1>
          <p id="today"></p>
        </div>
      </div>

      <div class="stats">
        <div class="stat" id="s-pending"><div class="label">Pending Requests</div><div class="value">…</div></div>
        <div class="stat" id="s-btoday"><div class="label">Borrowed Today</div><div class="value">…</div></div>
        <div class="stat" id="s-rtoday"><div class="label">Returned Today</div><div class="value">…</div></div>
        <div class="stat" id="s-overdue"><div class="label">Overdue Books</div><div class="value">…</div></div>
      </div>

      <section class="card" aria-labelledby="next-title">
        <h2 id="next-title">Next in line</h2>
        <div id="next" aria-live="polite"><p class="muted loading">Loading the queue…</p></div>
      </section>

      <section class="card" aria-labelledby="overdue-title">
        <h2 id="overdue-title">Overdue Books</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Student</th><th>Book</th><th>Due</th><th>Days late</th><th>Fine</th></tr></thead>
            <tbody id="overdue"><tr><td colspan="5" class="empty loading">Loading…</td></tr></tbody>
          </table>
        </div>
      </section>

      <section class="card" id="queue-card" aria-labelledby="queue-title" tabindex="-1">
        <div class="card-head">
          <h2 id="queue-title">Request Queue</h2>
          <span class="muted">Oldest first</span>
        </div>
        <div id="alert" class="alert hidden"></div>
        <div class="tabs" id="tabs" role="tablist">
          <button type="button" role="tab" data-tab="" class="active" aria-selected="true">All</button>
          <button type="button" role="tab" data-tab="borrow" aria-selected="false">Borrow</button>
          <button type="button" role="tab" data-tab="renew" aria-selected="false">Renew</button>
          <button type="button" role="tab" data-tab="return" aria-selected="false">Return</button>
          <button type="button" role="tab" data-tab="history" aria-selected="false">History</button>
        </div>

        <div id="history-tools" class="history-tools hidden" role="search" aria-label="Filter transaction history">
          <div class="history-row">
            <label for="h-search" class="visually-hidden">Search transactions</label>
            <input id="h-search" type="search" placeholder="Search student, book, librarian or code">
            <label for="h-type" class="visually-hidden">Transaction type</label>
            <select id="h-type">
              <option value="">All types</option>
              <option value="borrow">Borrow</option>
              <option value="renew">Renew</option>
              <option value="return">Return</option>
            </select>
            <label for="h-sort" class="visually-hidden">Sort order</label>
            <select id="h-sort">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
            </select>
          </div>
          <div class="history-row">
            <div class="segmented" id="h-period" role="group" aria-label="Time period">
              <button type="button" data-period="" aria-pressed="true">All time</button>
              <button type="button" data-period="day" aria-pressed="false">Today</button>
              <button type="button" data-period="week" aria-pressed="false">This week</button>
              <button type="button" data-period="month" aria-pressed="false">This month</button>
              <button type="button" data-period="year" aria-pressed="false">This year</button>
            </div>
            <span class="muted" id="h-count" aria-live="polite"></span>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead id="thead"></thead>
            <tbody id="rows"><tr><td class="empty loading">Loading…</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/librarian/dashboard.js"></script>
</body>
</html>
