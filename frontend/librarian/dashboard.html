<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Library</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="with-sidebar">
    <div id="shell" data-role="librarian"></div>

    <main>
      <div class="page-head">
        <div>
          <h1>Today at the desk</h1>
          <p class="muted" id="today"></p>
        </div>
      </div>

      <section class="card" aria-labelledby="next-title">
        <h2 id="next-title">Next in line</h2>
        <div id="next" aria-live="polite"><p class="muted">Loading the queue…</p></div>
      </section>

      <div class="stats">
        <div class="stat" id="s-borrow"><div class="label">Borrow requests</div><div class="value">…</div></div>
        <div class="stat" id="s-renew"><div class="label">Renew requests</div><div class="value">…</div></div>
        <div class="stat" id="s-return"><div class="label">Return requests</div><div class="value">…</div></div>
        <div class="stat" id="s-btoday"><div class="label">Borrowed today</div><div class="value">…</div></div>
        <div class="stat" id="s-rtoday"><div class="label">Returned today</div><div class="value">…</div></div>
        <div class="stat" id="s-overdue"><div class="label">Overdue books</div><div class="value">…</div></div>
      </div>

      <section class="card" id="queue-card" aria-labelledby="queue-title">
        <div class="card-head">
          <h2 id="queue-title">Request Queue</h2>
          <span class="muted">Oldest first</span>
        </div>
        <div id="alert" class="alert hidden"></div>
        <div class="tabs" id="tabs" role="tablist">
          <button type="button" role="tab" data-tab="" class="active" aria-selected="true">All</button>
          <button type="button" role="tab" data-tab="borrow" aria-selected="false">Borrow</button>
          <button type="button" role="tab" data-tab="renew" aria-selected="false">Renew</button>
          <button type="button" role="tab" data-tab="return" aria-selected="false">Return</button>
          <button type="button" role="tab" data-tab="history" aria-selected="false">History</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead id="thead"></thead>
            <tbody id="rows"><tr><td class="empty loading">Loading…</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/librarian/dashboard.js"></script>
</body>
</html>
