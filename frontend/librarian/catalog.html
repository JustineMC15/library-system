<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Catalog · Library</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="with-sidebar">
    <div id="shell" data-role="librarian"></div>

    <main>
      <div class="page-head">
        <div>
          <h1>Book Catalog</h1>
          <p class="muted" id="count" aria-live="polite">Loading…</p>
        </div>
      </div>

      <form id="filters" class="card filters" role="search">
        <div class="field">
          <label for="search">Search</label>
          <input id="search" type="search" placeholder="Title, author, ISBN or call number">
        </div>
        <div class="field">
          <span class="label-text" id="type-label">Type</span>
          <div class="segmented" id="type" role="group" aria-labelledby="type-label">
            <button type="button" data-type="" class="active" aria-pressed="true">All</button>
            <button type="button" data-type="Physical" aria-pressed="false">Physical</button>
            <button type="button" data-type="Digital" aria-pressed="false">Digital</button>
          </div>
        </div>
        <label class="checkbox"><input id="available" type="checkbox"> Available only</label>
      </form>

      <section class="card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Book ID</th><th>Title</th><th>ISBN</th><th>Year</th><th>Type</th><th>Status</th></tr></thead>
            <tbody id="books"><tr><td colspan="6" class="empty">Loading the catalog…</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/librarian/catalog.js"></script>
</body>
</html>
