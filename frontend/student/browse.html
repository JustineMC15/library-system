<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse Books · Library</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="shell" data-role="student"></div>

  <main>
    <div class="page-head">
      <div>
        <h1>Browse Books</h1>
        <p class="muted" id="count" aria-live="polite">Loading the catalog…</p>
      </div>
    </div>

    <form id="filters" class="card filters" role="search">
      <div class="field">
        <label for="search">Search</label>
        <input id="search" type="search" placeholder="Title, author, ISBN or call number">
      </div>
      <div class="field">
        <span class="label-text" id="type-label">Type</span>
        <div class="segmented" id="type" role="group" aria-labelledby="type-label">
          <button type="button" data-type="" class="active" aria-pressed="true">All</button>
          <button type="button" data-type="Physical" aria-pressed="false">Physical</button>
          <button type="button" data-type="Digital" aria-pressed="false">Digital</button>
        </div>
      </div>
      <label class="checkbox"><input id="available" type="checkbox"> Available only</label>
    </form>

    <div id="alert" class="alert hidden"></div>
    <div id="grid" class="book-grid"></div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/student/browse.js"></script>
</body>
</html>
